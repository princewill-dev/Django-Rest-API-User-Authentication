services:
  # Frontend service
  frontend:
    build: ./services/frontend
    ports:
      - "8000:80"
    volumes:
      - ./services/frontend:/usr/share/nginx/html

  # Nginx service
  nginx:
    image: nginx:stable-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./services/backend/static:/app/static
      - ./services/backend/media:/app/media
    depends_on:
      - web

  # Django web application
  web:
    build: ./services/backend
    restart: always
    ports:
      - "8001:8000"
    depends_on:
      - db
    env_file:
      - ./envs/.auth.env
    volumes:
      - ./services/backend:/app
      - ./services/backend/static:/app/static
      - ./services/backend/media:/app/media

  # PostgreSQL Database
  db:
    image: postgres:14
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - ./envs/.auth.env
    ports:
      - "5432:5432"

volumes:
  postgres_data:
