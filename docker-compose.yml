version: '3.8'

services:
  # Django web application
  web:
    build: .
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file:
      - ./envs/.auth.env
    volumes:
      - ./:/app

  # PostgreSQL Database
  db:
    image: postgres:14
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=storedb
    ports:
      - "5432:5432"

volumes:
  postgres_data:
