name: Build and Deploy to Railway

on:
  push:
    branches: [ main, master, dev ]
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v4
        with:
          context: ./services/backend
          push: true
          tags: princewilldev/store-backend:latest
          cache-from: type=registry,ref=princewilldev/store-backend:buildcache
          cache-to: type=registry,ref=princewilldev/store-backend:buildcache,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v4
        with:
          context: ./services/frontend
          push: true
          tags: princewilldev/store-frontend:latest
          cache-from: type=registry,ref=princewilldev/store-frontend:buildcache
          cache-to: type=registry,ref=princewilldev/store-frontend:buildcache,mode=max

      - name: Build and push nginx
        uses: docker/build-push-action@v4
        with:
          context: ./nginx
          push: true
          tags: princewilldev/store-nginx:latest
          cache-from: type=registry,ref=princewilldev/store-nginx:buildcache
          cache-to: type=registry,ref=princewilldev/store-nginx:buildcache,mode=max
      
      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Deploy to Railway
        run: |
          npm install -g @railway/cli
          railway up --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
