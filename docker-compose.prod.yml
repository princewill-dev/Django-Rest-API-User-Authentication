services:
  # Frontend service
  frontend:
    image: princewilldev/store-frontend:latest
    restart: always

  # Nginx service
  nginx:
    image: princewilldev/store-nginx:latest
    # Or use the official image with your config mounted
    # image: nginx:stable-alpine
    restart: always
    ports:
      - "80:80"
    depends_on:
      - web
      - frontend

  # Django web application
  web:
    image: princewilldev/store-backend:latest
    restart: always
    depends_on:
      - db
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL}

  # PostgreSQL Database
  db:
    image: postgres:14
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}

volumes:
  postgres_data:
